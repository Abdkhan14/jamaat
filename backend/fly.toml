app = "jamaat-backend"
primary_region = "yyz"

[build]

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/prayer_times.db"

[[mounts]]
  source = "jamaat_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
