# Local eval runner — run from backend/ with:
#   PYTHONPATH=. PROMPTFOO_PYTHON=.venv/bin/python \
#     npx promptfoo@0.124.1 eval -c evals/promptfooconfig.yaml
#   npx promptfoo@0.124.1 view

prompts:
  - file://prompts.py:current
  # Add candidate prompt functions here when comparing alternatives:
  # - file://prompts.py:candidate

providers:
  - id: file://provider.py
    label: gpt-5.1
    config:
      model: gpt-5.1
      # Prices in USD per 1M tokens — update if OpenAI changes rates:
      # https://openai.com/api/pricing
      input_price_per_mtok: 1.25
      output_price_per_mtok: 10.0
  # To compare another model, add a second entry here:
  # - id: file://provider.py
  #   label: <model-name>
  #   config:
  #     model: <model-name>
  #     input_price_per_mtok: 0.0
  #     output_price_per_mtok: 0.0

tests: file://cases.yaml

defaultTest:
  assert:
    - type: python
      value: file://scorer.py

evaluateOptions:
  repeat: 3
  maxConcurrency: 4
