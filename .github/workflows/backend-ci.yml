name: Backend CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t jamaat-backend ./backend
      - name: Syntax and import check
        run: |
          docker run --rm \
            -e OPENAI_API_KEY=ci-placeholder \
            jamaat-backend \
            python -c "
          import compileall, sys
          ok = compileall.compile_dir('.', quiet=1)
          if not ok:
              sys.exit(1)
          import routes, scheduler, scraping.pipeline
          print('imports OK')
          "
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backend tests
        working-directory: backend
        env:
          OPENAI_API_KEY: ci-placeholder
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q
